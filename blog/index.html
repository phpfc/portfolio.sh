<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Technical writing by Pedro França on software development and architecture.">
    <title>Writing - Pedro França</title>
    <link rel="icon" href="../favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:wght@600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            line-height: 1.6;
            color: #000;
            background: #faf8f3;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        body.dark {
            background: #1a1816;
            color: #e8e6e1;
        }
        
        h1, h2 {
            font-family: Fraunces, "Iowan Old Style", "Palatino Linotype", serif;
        }
        
        h1 { font-size: 32px; margin: 40px 0 10px; }
        h2 { font-size: 18px; margin: 20px 0 5px; }
        
        p { margin: 10px 0; }
        
        a {
            color: #000;
            text-decoration: underline;
        }
        
        body.dark a { color: #fff; }
        
        .meta {
            color: #666;
            font-size: 14px;
        }
        
        .post {
            margin: 30px 0;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        
        body.dark .post {
            border-bottom-color: #333;
        }
        
        .post:last-child {
            border-bottom: none;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        button {
            background: none;
            border: 1px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
            color: #000;
        }
        
        body.dark button {
            border-color: #fff;
            color: #fff;
        }
        
        button:hover {
            background: #000;
            color: #fff;
        }
        
        body.dark button:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="theme-toggle">Dark</button>
        <button id="lang-toggle">PT</button>
    </div>
    
    <p><a href="../">← Back</a></p>
    
    <h1>Writing</h1>
    <p>Thoughts on software architecture, system design, and engineering practices.</p>
    
    <div id="posts"></div>
    
    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            themeBtn.textContent = 'Light';
        }
        
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeBtn.textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        
        const langBtn = document.getElementById('lang-toggle');
        const savedLang = localStorage.getItem('portfolio-language') || 'en';
        let currentLang = savedLang;
        
        langBtn.textContent = currentLang === 'en' ? 'PT' : 'EN';
        
        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'pt' : 'en';
            langBtn.textContent = currentLang === 'en' ? 'PT' : 'EN';
            localStorage.setItem('portfolio-language', currentLang);
            
            updateContent();
        });
        
        function updateContent() {
            const h1 = document.querySelector('h1');
            const intro = document.querySelector('p:nth-of-type(2)');
            
            if (currentLang === 'pt') {
                h1.textContent = 'Escrita';
                intro.textContent = 'Reflexões sobre arquitetura de software, design de sistemas e práticas de engenharia.';
            } else {
                h1.textContent = 'Writing';
                intro.textContent = 'Thoughts on software architecture, system design, and engineering practices.';
            }
        }
        
        updateContent();
        
        const postsContainer = document.getElementById('posts');
        const posts = [
            {
                slug: 'cadentia-honest-gamification',
                title: 'Cadentia: Building Free Music Education, End to End',
                excerpt: 'A free, browser-based music education platform I took from zero to production solo. The stack, the generated API contract, and the Railway infrastructure behind it.',
                date: '2025-08-26'
            },
            {
                slug: 'cymatic-audiovisual-synthesizer',
                title: 'Building Cymatic: Where Music Theory Meets WebGL',
                excerpt: 'From music teacher to developer: building a browser-based audiovisual synthesizer that visualizes the science of sound.',
                date: '2025-01-15'
            },
            {
                slug: 'mobile-stack-unification',
                title: 'Mobile Stack Unification: Flutter to React Native',
                excerpt: 'The technical and strategic reasoning behind our mobile stack unification. From proof of concept to company-wide adoption.',
                date: '2024-12-15'
            },
            {
                slug: 'vendor-independent-auth',
                title: 'Building Vendor-Independent Authentication Systems',
                excerpt: 'Designing authentication architecture that avoids vendor lock-in. How to build fallback systems that make provider migration painless.',
                date: '2024-11-20'
            }
        ];
        
        posts.forEach(post => {
            const postEl = document.createElement('div');
            postEl.className = 'post';
            postEl.innerHTML = `
                <p class="meta">${new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                <h2><a href="posts/${post.slug}.html">${post.title}</a></h2>
                <p>${post.excerpt}</p>
            `;
            postsContainer.appendChild(postEl);
        });
    </script>
</body>
</html>
