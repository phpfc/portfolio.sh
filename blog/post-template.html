<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="{{DESCRIPTION}}">

    <title>{{TITLE}} - Pedro França</title>

    <link rel="icon" href="../../favicon.svg">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../blog.css">

    <!-- Prism.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="../../" class="nav-brand">PF</a>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="../../#about" class="nav-link">About</a></li>
                <li><a href="../../#experience" class="nav-link">Experience</a></li>
                <li><a href="../../#projects" class="nav-link">Projects</a></li>
                <li><a href="../../#writing" class="nav-link">Writing</a></li>
                <li><a href="../../#contact" class="nav-link">Contact</a></li>
            </ul>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Article -->
    <article class="section">
        <div class="container">
            <div class="article-content">
                <header class="article-header">
                    <div class="article-meta">
                        <time datetime="{{DATE}}">{{DATE_FORMATTED}}</time>
                        {{TAGS}}
                    </div>
                    <h1>{{TITLE}}</h1>
                </header>

                <div class="article-body">
                    {{CONTENT}}
                </div>

                <footer class="article-footer">
                    <a href="../" class="back-link">
                        ← Back to all posts
                    </a>
                </footer>
            </div>
        </div>
    </article>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Pedro Henrique França. <a href="../../">Back to home</a></p>
        </div>
    </footer>

    <script src="../../js/main.js"></script>

    <!-- Prism.js for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-glsl.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
</body>
</html>
